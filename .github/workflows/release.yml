name: Release

# Creates the tag v<version> and a GitHub Release with the Tizen build attached.
# Run it from the Actions tab (or the API) with the version, e.g. 0.1.0.
# The web version is published by "Deploy web" on every push to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3, got: $VERSION" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stamp the version in the Tizen manifest
        run: sed -i -E "/<widget /s/ version=\"[0-9.]+\"/ version=\"$VERSION\"/" src/platform/tizen/public/config.xml
      - name: Build
        run: npm run build && npm run build:tizen && npm run size
        env:
          VERTELES_VERSION: ${{ inputs.version }}
      - name: Package the Tizen build (unsigned, see docs/tizen.md)
        run: (cd dist-tizen && zip -qr "../verteles-tizen-$VERSION.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Verteles ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: verteles-tizen-*.zip
